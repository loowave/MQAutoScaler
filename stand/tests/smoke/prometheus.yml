# Сбор метрик в smoke-тесте. Метки namespace и service совпадают с теми, что в кластере
# проставляет ServiceMonitor, поэтому recording rules работают без изменений.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/generated/rules.yaml
scrape_configs:
  - job_name: ingest
    dns_sd_configs:
      - names: [ingest]
        type: A
        port: 9100
        refresh_interval: 5s
    relabel_configs:
      - {target_label: namespace, replacement: platform}
      - {target_label: service, replacement: ingest}
      - {source_labels: [__address__], target_label: pod}
  - job_name: filter
    dns_sd_configs:
      - names: [filter]
        type: A
        port: 9100
        refresh_interval: 5s
    relabel_configs:
      - {target_label: namespace, replacement: platform}
      - {target_label: service, replacement: filter}
      - {source_labels: [__address__], target_label: pod}
  - job_name: enricher
    dns_sd_configs:
      - names: [enricher]
        type: A
        port: 9100
        refresh_interval: 5s
    relabel_configs:
      - {target_label: namespace, replacement: platform}
      - {target_label: service, replacement: enricher}
      - {source_labels: [__address__], target_label: pod}
  - job_name: processor
    dns_sd_configs:
      - names: [processor]
        type: A
        port: 9100
        refresh_interval: 5s
    relabel_configs:
      - {target_label: namespace, replacement: platform}
      - {target_label: service, replacement: processor}
      - {source_labels: [__address__], target_label: pod}
  - job_name: showcase
    dns_sd_configs:
      - names: [showcase]
        type: A
        port: 9100
        refresh_interval: 5s
    relabel_configs:
      - {target_label: namespace, replacement: platform}
      - {target_label: service, replacement: showcase}
      - {source_labels: [__address__], target_label: pod}
  - job_name: kafka
    dns_sd_configs:
      - names: [kafka]
        type: A
        port: 9404
        refresh_interval: 5s
    relabel_configs:
      - {target_label: namespace, replacement: data}
      - {target_label: service, replacement: kafka}
      - {source_labels: [__address__], target_label: pod}
  - job_name: kafka-exporter
    dns_sd_configs:
      - names: [kafka-exporter]
        type: A
        port: 9308
        refresh_interval: 5s
    relabel_configs:
      - {target_label: namespace, replacement: data}
      - {target_label: service, replacement: kafka-exporter}
      - {source_labels: [__address__], target_label: pod}
  - job_name: postgres
    dns_sd_configs:
      - names: [postgres-exporter]
        type: A
        port: 9187
        refresh_interval: 5s
    relabel_configs:
      - {target_label: namespace, replacement: data}
      - {target_label: service, replacement: postgres}
      - {source_labels: [__address__], target_label: pod}
  - job_name: mongodb
    dns_sd_configs:
      - names: [mongodb-exporter]
        type: A
        port: 9216
        refresh_interval: 5s
    relabel_configs:
      - {target_label: namespace, replacement: data}
      - {target_label: service, replacement: mongodb}
      - {source_labels: [__address__], target_label: pod}
  - job_name: redis
    dns_sd_configs:
      - names: [redis-exporter]
        type: A
        port: 9121
        refresh_interval: 5s
    relabel_configs:
      - {target_label: namespace, replacement: data}
      - {target_label: service, replacement: redis}
      - {source_labels: [__address__], target_label: pod}
