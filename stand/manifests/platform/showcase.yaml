# Витрина: отдаёт результаты обработки по HTTP, читает из PostgreSQL через кеш Redis.
apiVersion: v1
kind: Service
metadata:
  name: showcase
  labels:
    app.kubernetes.io/name: showcase
    mqautoscaler/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: showcase
  ports:
    - {name: http, port: 8080}
    - {name: metrics, port: 9100}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase
  labels:
    app.kubernetes.io/name: showcase
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: showcase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showcase
        app.kubernetes.io/component: gateway
    spec:
      enableServiceLinks: false
      nodeSelector:
        mqautoscaler/app: "true"
      containers:
        - name: service
          image: mqautoscaler/platform:0.1.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - {name: ROLE, value: "showcase"}
            - {name: WORK_MS, value: "3"}
            - {name: CACHE_TTL_S, value: "5"}
            - {name: PG_POOL, value: "10"}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: password}
            - name: PG_DSN
              value: postgresql://postgres:$(PG_PASSWORD)@postgres.data.svc.cluster.local:5432/platform
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9100}
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
