# Вход платформы: принимает события по HTTP и пишет их в брокер.
apiVersion: v1
kind: Service
metadata:
  name: ingest
  labels:
    app.kubernetes.io/name: ingest
    mqautoscaler/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: ingest
  ports:
    - {name: http, port: 8080}
    - {name: metrics, port: 9100}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels:
    app.kubernetes.io/name: ingest
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest
        app.kubernetes.io/component: gateway
    spec:
      enableServiceLinks: false
      nodeSelector:
        mqautoscaler/app: "true"
      containers:
        - name: service
          image: mqautoscaler/platform:0.1.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - {name: ROLE, value: "ingest"}
            - {name: OUT_TOPIC, value: "events-raw"}
            - {name: WORK_MS, value: "1"}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9100}
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
