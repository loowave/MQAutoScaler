# Первая задача воркфлоу: дополняет событие профилем арендатора из справочника.
apiVersion: v1
kind: Service
metadata:
  name: enricher
  labels:
    app.kubernetes.io/name: enricher
    mqautoscaler/scrape: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: enricher
  ports:
    - {name: metrics, port: 9100}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enricher
  labels:
    app.kubernetes.io/name: enricher
    app.kubernetes.io/component: consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: enricher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enricher
        app.kubernetes.io/component: consumer
    spec:
      enableServiceLinks: false
      nodeSelector:
        mqautoscaler/app: "true"
      containers:
        - name: service
          image: mqautoscaler/platform:0.1.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - {name: ROLE, value: "enricher"}
            - {name: IN_TOPIC, value: "events-filtered"}
            - {name: OUT_TOPIC, value: "events-enriched"}
            - {name: WORK_MS, value: "2"}
          ports:
            - {name: metrics, containerPort: 9100}
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 5
