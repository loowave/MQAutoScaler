# Вторая задача воркфлоу: выполняет внешний вызов и записывает результат для витрины.
apiVersion: v1
kind: Service
metadata:
  name: processor
  labels:
    app.kubernetes.io/name: processor
    mqautoscaler/scrape: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: processor
  ports:
    - {name: metrics, port: 9100}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels:
    app.kubernetes.io/name: processor
    app.kubernetes.io/component: consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor
        app.kubernetes.io/component: consumer
    spec:
      enableServiceLinks: false
      nodeSelector:
        mqautoscaler/app: "true"
      containers:
        - name: service
          image: mqautoscaler/platform:0.1.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - {name: ROLE, value: "processor"}
            - {name: IN_TOPIC, value: "events-enriched"}
            - {name: WORK_MS, value: "8"}
            - {name: EXTERNAL_LATENCY_MS, value: "50"}
            - {name: EXTERNAL_FAIL_RATE, value: "0.01"}
            - {name: PG_POOL, value: "10"}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: password}
            - name: PG_DSN
              value: postgresql://postgres:$(PG_PASSWORD)@postgres.data.svc.cluster.local:5432/platform
          ports:
            - {name: metrics, containerPort: 9100}
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 5
