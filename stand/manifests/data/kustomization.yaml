apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - kafka.yaml
  - postgres.yaml
  - mongodb.yaml
  - redis.yaml
configMapGenerator:
  - name: kafka-jmx
    files:
      - config.yaml=config/kafka-jmx.yaml
  - name: postgres-init
    files:
      - 01-schema.sql=config/postgres-schema.sql
generatorOptions:
  disableNameSuffixHash: true
