# MongoDB: справочник арендаторов для обогащения событий. Читается при промахах кеша Redis.
# Без авторизации: доступ только внутри кластера, данные синтетические.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app.kubernetes.io/name: mongodb
    mqautoscaler/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - {name: mongodb, port: 27017}
    - {name: metrics, port: 9216}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
    spec:
      enableServiceLinks: false
      nodeSelector:
        mqautoscaler/data: "true"
      containers:
        - name: mongodb
          image: mongo:8.0.34
          args:
            - --bind_ip_all
            # Без явного лимита WiredTiger рассчитывает кеш от памяти ноды, а не контейнера.
            - --wiredTigerCacheSizeGB=0.5
          ports:
            - {name: mongodb, containerPort: 27017}
          resources:
            requests: {cpu: "1", memory: 1536Mi}
            limits: {cpu: "1", memory: 1536Mi}
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping')"]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data/db}
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.54.0
          args:
            - --mongodb.uri=mongodb://127.0.0.1:27017
            - --collect-all
            - --compatible-mode
            - --web.listen-address=:9216
          ports:
            - {name: metrics, containerPort: 9216}
          resources:
            requests: {cpu: 200m, memory: 128Mi}
            limits: {cpu: 200m, memory: 128Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: stand-local
        resources:
          requests:
            storage: 20Gi
