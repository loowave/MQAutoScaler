# PostgreSQL: результаты обработки событий и агрегаты для витрины.
# Запись в tenant_stats берёт блокировку строки арендатора, поэтому популярные арендаторы
# создают конкуренцию за блокировки, а синхронная фиксация транзакций нагружает диск.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    mqautoscaler/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - {name: postgres, port: 5432}
    - {name: metrics, port: 9187}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      enableServiceLinks: false
      nodeSelector:
        mqautoscaler/data: "true"
      containers:
        - name: postgres
          image: postgres:17.11
          args:
            - -c
            - max_connections=200
            - -c
            - shared_buffers=256MB
            - -c
            - track_io_timing=on
          env:
            - {name: POSTGRES_DB, value: platform}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, platform]
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: password}
            - name: DATA_SOURCE_NAME
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@localhost:5432/platform?sslmode=disable
          ports:
            - {name: metrics, containerPort: 9187}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: stand-local
        resources:
          requests:
            storage: 20Gi
