# Redis: дедупликация в фильтре и кеш справочника и витрины. Без персистентности.
# Лимит памяти намеренно небольшой: при большом потоке начинаются вытеснения ключей.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    mqautoscaler/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - {name: redis, port: 6379}
    - {name: metrics, port: 9121}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      enableServiceLinks: false
      nodeSelector:
        mqautoscaler/data: "true"
      containers:
        - name: redis
          image: redis:7.4.12
          args: [--maxmemory, 256mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 500m, memory: 384Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.97.0
          env:
            - {name: REDIS_ADDR, value: "redis://localhost:6379"}
          ports:
            - {name: metrics, containerPort: 9121}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 100m, memory: 64Mi}
