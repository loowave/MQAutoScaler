# Брокер событий: один узел Kafka в режиме KRaft.
#
# В каждом топике 6 партиций, поэтому полезно не больше 6 реплик одного консьюмера.
# Объём партиции ограничен (retention.bytes): если backlog его превышает, старые сообщения
# вытесняются до чтения. Это отдельный режим деградации, он виден в consumer_evicted_messages_total.
#
# enableServiceLinks: false во всех подах стенда: иначе Kubernetes добавит переменные вроде KAFKA_PORT,
# а образ Kafka превращает все переменные KAFKA_* в настройки брокера.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    mqautoscaler/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - {name: broker, port: 9092}
    - {name: metrics, port: 9404}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
    spec:
      enableServiceLinks: false
      nodeSelector:
        mqautoscaler/data: "true"
      initContainers:
        - name: fetch-jmx-agent
          image: curlimages/curl:8.23.0
          command: [sh, -ec]
          args:
            - |
              curl -fsSL --retry 5 -o /jmx/agent.jar "$AGENT_URL"
              echo "$AGENT_SHA256  /jmx/agent.jar" | sha256sum -c -
          env:
            - name: AGENT_URL
              value: https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/1.0.1/jmx_prometheus_javaagent-1.0.1.jar
            - name: AGENT_SHA256
              value: 7d61f737fd661610ccc14aea79764faa1ea94a340cbc8f0029b3d2edea3d80c1
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: jmx-agent, mountPath: /jmx}
      containers:
        - name: kafka
          image: apache/kafka:3.9.2
          env:
            - {name: CLUSTER_ID, value: 4L6g3nShT-eMCtK--X86sw}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.data.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS, value: "10000"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx512m"}
            - {name: KAFKA_OPTS, value: "-javaagent:/jmx/agent.jar=9404:/jmx-config/config.yaml"}
          ports:
            - {name: broker, containerPort: 9092}
            - {name: metrics, containerPort: 9404}
          resources:
            requests: {cpu: "1", memory: 1536Mi}
            limits: {cpu: "1", memory: 1536Mi}
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: jmx-agent, mountPath: /jmx}
            - {name: jmx-config, mountPath: /jmx-config}
      volumes:
        - name: jmx-agent
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: kafka-jmx
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: stand-local
        resources:
          requests:
            storage: 20Gi
---
# Топики создаются явно: автосоздание выключено, чтобы опечатка в имени топика не прошла незаметно.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  labels:
    app.kubernetes.io/name: kafka-topics
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      nodeSelector:
        mqautoscaler/data: "true"
      containers:
        - name: create-topics
          image: apache/kafka:3.9.2
          command: [bash, -ec]
          args:
            - |
              for topic in events-raw events-filtered events-enriched; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKER" --create --if-not-exists \
                  --topic "$topic" --partitions 6 --replication-factor 1 \
                  --config retention.bytes=134217728 --config segment.bytes=16777216
              done
          env:
            - {name: BROKER, value: "kafka.data.svc.cluster.local:9092"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
# Экспортер смещений и lag. Работает на ноде infra: это наблюдение, а не часть измеряемой системы.
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  labels:
    app.kubernetes.io/name: kafka-exporter
    mqautoscaler/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: kafka-exporter
  ports:
    - {name: metrics, port: 9308}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  labels:
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/component: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-exporter
        app.kubernetes.io/component: metrics
    spec:
      enableServiceLinks: false
      nodeSelector:
        mqautoscaler/infra: "true"
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.11.0
          args:
            - --kafka.server=kafka.data.svc.cluster.local:9092
          ports:
            - {name: metrics, containerPort: 9308}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
