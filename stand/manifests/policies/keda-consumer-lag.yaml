      metadata:
        bootstrapServers: kafka.data.svc.cluster.local:9092
        consumerGroup: enricher
        topic: events-filtered
        lagThreshold: "200"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
