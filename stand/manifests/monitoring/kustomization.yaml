apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - servicemonitor.yaml
  - rules.yaml
configMapGenerator:
  - name: mqautoscaler-dashboard
    files:
      - mqautoscaler.json=dashboards/mqautoscaler.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
