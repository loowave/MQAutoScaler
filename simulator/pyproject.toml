[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mqsim"
version = "0.1.0"
description = "Fixed-step simulation core for interacting services"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3",
]

[tool.setuptools]
packages = ["mqsim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=9.2.0",
]
